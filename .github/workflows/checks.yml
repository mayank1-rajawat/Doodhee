name: Validate Doodhee
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: doodhee
          POSTGRES_USER: doodhee
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U doodhee'
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://doodhee:ci-only@localhost:5432/doodhee
      TEST_DATABASE_URL: postgres://doodhee:ci-only@localhost:5432/doodhee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum}
      - run: go run ./cmd/migrate && go test -race ./... && go vet ./...
        working-directory: backend
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: admin-web/package-lock.json}
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
        working-directory: admin-web
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum}
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: mobile-app
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: mobile-app/tooling/storage_tests
      - run: node scripts/check-contracts.mjs
