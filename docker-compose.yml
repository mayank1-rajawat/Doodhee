services:
  postgres:
    image: postgres:16-alpine
    container_name: doodhee-dev-db
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: doodhee
      POSTGRES_DB: doodhee
      POSTGRES_PASSWORD: doodhee-local-only
    volumes: ["doodhee-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doodhee -d doodhee"]
      interval: 3s
      retries: 20
volumes:
  doodhee-data:
